name: Startup regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh config/oobe.sh config/cdc-env.sh config/.bashrc; do
            bash -n "$script"
          done
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Install locked Python test environment
        run: uv sync --locked

      - name: Check startup failure and recovery paths
        run: uv run --locked pytest -q
